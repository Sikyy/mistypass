name: Web Admin CI

on:
  pull_request:
    paths:
      - "web-admin/**"
      - "scripts/check-hardcoded-cjk.mjs"
      - ".github/workflows/web-admin-ci.yml"
  push:
    branches: [main]
    paths:
      - "web-admin/**"
      - "scripts/check-hardcoded-cjk.mjs"
      - ".github/workflows/web-admin-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web-admin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-admin
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web-admin/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Check Hardcoded CJK
        run: npm run check:cjk

      - name: Typecheck
        run: npm run typecheck

      - name: Unit Test
        run: npm run test:unit

      - name: Build
        run: npm run build

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: E2E Test
        run: npx playwright test -c playwright.config.ts
