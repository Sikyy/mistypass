name: Security Scan

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "45 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gosec:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: api/go.mod

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpcsclite-dev

      - name: Install gosec
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@v2.22.10
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Run gosec
        working-directory: api
        # -severity medium: skip LOW noise (mostly G104 errors-unhandled).
        # -confidence medium: skip LOW-confidence false positives (e.g. G101
        #   flagging SQL column names in sqlcgen/ as "hardcoded credentials").
        # -exclude G115: integer-overflow flags on int↔int32 in postgres pagination.
        #   Bounded by sql.LIMIT clauses, not user input.
        run: gosec -severity medium -confidence medium -exclude G115 ./...

  trivy-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build API Image
        run: docker build -f api/Dockerfile -t mistypass-api:ci .

      - name: Trivy Scan API Image
        # Pin to a released tag, not @master: a third-party action on a mutable
        # ref runs arbitrary code in CI on every push.
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: mistypass-api:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH
