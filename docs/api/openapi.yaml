openapi: 3.0.3
info:
  title: MistyPass Cloud API
  description: |
    MistyPass 云端 API 内部文档。涵盖移动端（iOS/Android）、网关设备、企业集成等全部接口。

    ## 认证方式

    | 方式 | Header | 适用场景 |
    |------|--------|----------|
    | Bearer Token (JWT) | `Authorization: Bearer <access_token>` | 移动端 & Web 管理后台 |
    | Gateway Token | `Authorization: Bearer <gateway_token>` | 网关设备上报 |
    | SCIM Bearer | `Authorization: Bearer <scim_token>` | 企业用户同步 |

    ## 环境

    | 环境 | Base URL |
    |------|----------|
    | 本地开发 | `http://localhost:8080/api/v1` |
    | Mock (Prism) | `http://localhost:4010/api/v1` |
    | Staging | `https://staging-api.mistyislet.com/api/v1` |
    | 生产 | `https://api.mistyislet.com/api/v1` |

    ## 通用约定

    - 所有时间字段均为 UTC ISO 8601 格式
    - 分页列表返回 `{ "items": [...], "total": N }`
    - 错误返回 `{ "error": "message" }`
    - 401 表示 token 过期，客户端应自动 refresh
    - 多租户隔离：tenant_id 从 JWT claims 中提取

  version: 1.0.0
  contact:
    name: MistyPass 后端团队

servers:
  - url: https://staging-api.mistyislet.com/api/v1
    description: Staging
  - url: http://localhost:8080/api/v1
    description: 本地开发

tags:
  - name: Auth
    description: 认证 & 会话管理
  - name: Profile
    description: 用户个人信息 & 设备
  - name: Organization
    description: 组织 & 场所（多租户）
  - name: Doors
    description: 门禁操作（开锁、收藏、搜索）
  - name: Credentials
    description: 移动凭证 & NFC 卡
  - name: Visitors
    description: 访客通行证 & 访客组
  - name: Admin-Users
    description: "[管理] 用户管理"
  - name: Admin-Groups
    description: "[管理] 门禁组"
  - name: Admin-Teams
    description: "[管理] 团队 & 权限"
  - name: Admin-Schedules
    description: "[管理] 时间表"
  - name: Admin-Events
    description: "[管理] 事件 & 事故"
  - name: Admin-Alarms
    description: "[管理] 告警 & 告警计划"
  - name: Admin-Guests
    description: "[管理] 访客登记"
  - name: Admin-Bookings
    description: "[管理] 空间预订"
  - name: Admin-Cards
    description: "[管理] 卡片 & 数字凭证"
  - name: Admin-Cameras
    description: "[管理] 摄像头 & 视频"
  - name: Admin-Analytics
    description: "[管理] 数据分析 & 导出"
  - name: Admin-Hardware
    description: "[管理] 硬件重命名（门/网关/摄像头）"
  - name: Admin-Settings
    description: "[管理] 组织 & 场所设置"
  - name: Gateway
    description: 网关设备接口（设备→云端）
  - name: Lockdown
    description: 紧急封锁

paths:
  # ─────────────────────────────────────────────
  # AUTH
  # ─────────────────────────────────────────────
  /app/auth/login:
    post:
      tags: [Auth]
      summary: 用户登录
      description: 支持邮箱密码登录，可选 MFA 验证码。返回 access_token + refresh_token。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: 邮箱或密码错误
        '403':
          description: 需要 MFA 验证码 / 账号被禁用
        '429':
          description: 登录频率限制

  /app/auth/refresh:
    post:
      tags: [Auth]
      summary: 刷新 Token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token:
                  type: string
      responses:
        '200':
          description: 新 Token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshResponse'
        '401':
          description: Refresh token 无效或已过期

  /app/auth/restore-password:
    post:
      tags: [Auth]
      summary: 重置密码
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        '200':
          description: 重置邮件已发送（不泄露用户是否存在）

  /app/auth/magic-link:
    post:
      tags: [Auth]
      summary: 发送 Magic Link 登录链接
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        '200':
          description: Magic link 已发送
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: sent

  /app/auth/magic-link/verify:
    post:
      tags: [Auth]
      summary: 验证 Magic Link Token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
      responses:
        '200':
          description: 验证成功，返回登录态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'

  /app/auth/org-lookup:
    get:
      tags: [Auth]
      summary: 查询组织认证配置
      description: 根据邮箱域名查询组织的 SSO/认证方式
      parameters:
        - name: domain
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 组织认证配置
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgAuthConfig'

  # ─────────────────────────────────────────────
  # PROFILE
  # ─────────────────────────────────────────────
  /app/me:
    get:
      tags: [Profile]
      summary: 获取当前用户信息
      security:
        - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
    patch:
      tags: [Profile]
      summary: 更新用户信息
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

  /app/me/avatar:
    post:
      tags: [Profile]
      summary: 上传头像
      security:
        - bearerAuth: []
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                avatar:
                  type: string
                  format: binary
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

  /app/me/change-password:
    post:
      tags: [Profile]
      summary: 修改密码
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password:
                  type: string
                new_password:
                  type: string
      responses:
        '200':
          description: 密码已修改

  /app/me/logins:
    get:
      tags: [Profile]
      summary: 获取活跃会话列表
      security:
        - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/UserLogin'

  /app/me/logins/{loginId}:
    delete:
      tags: [Profile]
      summary: 远程登出指定会话
      security:
        - bearerAuth: []
      parameters:
        - name: loginId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 已登出

  /app/me/primary-device:
    post:
      tags: [Profile]
      summary: 设置当前设备为主设备
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 已设置

  /app/devices/apns:
    post:
      tags: [Profile]
      summary: 注册 APNs 推送 Token (iOS)
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [device_token, platform]
              properties:
                device_token:
                  type: string
                platform:
                  type: string
                  enum: [ios, android]
      responses:
        '200':
          description: Token 已注册

  /app/devices/fcm:
    post:
      tags: [Profile]
      summary: 注册 FCM 推送 Token (Android)
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [device_token, platform]
              properties:
                device_token:
                  type: string
                platform:
                  type: string
                  enum: [android]
      responses:
        '200':
          description: Token 已注册

  # ─────────────────────────────────────────────
  # ORGANIZATION & PLACES
  # ─────────────────────────────────────────────
  /app/orgs:
    get:
      tags: [Organization]
      summary: 获取用户所属的组织列表
      security:
        - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Organization'

  /app/orgs/{orgId}/switch:
    post:
      tags: [Organization]
      summary: 切换当前组织
      description: 返回新的 token，切换到指定组织的上下文
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/orgId'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'

  /app/orgs/{orgId}/places:
    get:
      tags: [Organization]
      summary: 获取组织下的场所列表
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/orgId'
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Place'

  /app/orgs/{orgId}/places/search:
    get:
      tags: [Organization]
      summary: 搜索场所
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/orgId'
        - name: q
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Place'

  # ─────────────────────────────────────────────
  # DOORS
  # ─────────────────────────────────────────────
  /app/access/my-doors:
    get:
      tags: [Doors]
      summary: 获取我有权限的门列表（旧版平铺）
      security:
        - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedDoors'

  /app/access/unlock:
    post:
      tags: [Doors]
      summary: 远程开锁（旧版）
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [lock_id]
              properties:
                lock_id:
                  type: string
                ble_token:
                  type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnlockResponse'

  /app/access/logs:
    get:
      tags: [Doors]
      summary: 获取开锁日志
      security:
        - bearerAuth: []
      parameters:
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAccessLogs'

  /app/access/pin-code:
    get:
      tags: [Doors]
      summary: 获取 TOTP 开门 PIN 码
      security:
        - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  pin:
                    type: string
                    example: "482917"
                  expires_in:
                    type: integer
                    example: 30

  /app/access/ble-token:
    get:
      tags: [Doors]
      summary: 获取 BLE 开锁 Token
      security:
        - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                  expires_at:
                    type: string
                    format: date-time

  /app/places/{placeId}/doors:
    get:
      tags: [Doors]
      summary: 获取场所下的门列表
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/placeId'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedDoors'

  /app/places/{placeId}/doors/search:
    get:
      tags: [Doors]
      summary: 搜索场所内的门
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/placeId'
        - name: q
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedDoors'

  /app/places/{placeId}/doors/{doorId}/unlock:
    post:
      tags: [Doors]
      summary: 远程开锁（场所维度）
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/placeId'
        - $ref: '#/components/parameters/doorId'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [lock_id]
              properties:
                lock_id:
                  type: string
                ble_token:
                  type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnlockResponse'

  /app/places/{placeId}/doors/{doorId}/favorite:
    put:
      tags: [Doors]
      summary: 收藏门
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/placeId'
        - $ref: '#/components/parameters/doorId'
      responses:
        '200':
          description: 已收藏
    delete:
      tags: [Doors]
      summary: 取消收藏门
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/placeId'
        - $ref: '#/components/parameters/doorId'
      responses:
        '200':
          description: 已取消

  # ─────────────────────────────────────────────
  # LOCKDOWN
  # ─────────────────────────────────────────────
  /app/places/{placeId}/lockdown:
    post:
      tags: [Lockdown]
      summary: 启用场所紧急封锁
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/placeId'
      responses:
        '200':
          description: 封锁已启用
    delete:
      tags: [Lockdown]
      summary: 解除场所封锁
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/placeId'
      responses:
        '200':
          description: 封锁已解除

  /app/places/{placeId}/doors/{doorId}/lockdown:
    post:
      tags: [Lockdown]
      summary: 启用单门封锁
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/placeId'
        - $ref: '#/components/parameters/doorId'
      responses:
        '200':
          description: 封锁已启用
    delete:
      tags: [Lockdown]
      summary: 解除单门封锁
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/placeId'
        - $ref: '#/components/parameters/doorId'
      responses:
        '200':
          description: 封锁已解除

  # ─────────────────────────────────────────────
  # CREDENTIALS
  # ─────────────────────────────────────────────
  /app/credentials/register:
    post:
      tags: [Credentials]
      summary: 注册移动凭证（BLE 公钥）
      description: |
        客户端生成 EC P-256 密钥对后，将公钥提交到云端注册。
        Android 提交 Keystore attestation chain 用于安全等级验证。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterMobileCredentialRequest'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileCredential'

  /app/credentials/mobile:
    get:
      tags: [Credentials]
      summary: 获取移动凭证列表
      security:
        - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedMobileCredentials'

  /app/credentials/mobile/{credentialId}:
    delete:
      tags: [Credentials]
      summary: 吊销移动凭证
      security:
        - bearerAuth: []
      parameters:
        - name: credentialId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 已吊销

  /app/credentials/mobile/{credentialId}/refresh:
    post:
      tags: [Credentials]
      summary: 刷新移动凭证有效期
      security:
        - bearerAuth: []
      parameters:
        - name: credentialId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileCredential'

  /app/credentials/nfc:
    post:
      tags: [Credentials]
      summary: 绑定 NFC 卡
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [card_uid]
              properties:
                card_uid:
                  type: string
                  description: NFC 卡 UID（支持冒号、短横线、空格分隔，自动标准化）
                card_type:
                  type: string
                  default: desfire_ev3
                label:
                  type: string
                  default: NFC Card
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NFCCard'
        '409':
          description: 卡已绑定其他用户
    get:
      tags: [Credentials]
      summary: 获取我的 NFC 卡列表
      security:
        - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NFCCard'

  /app/credentials/nfc/{credentialId}:
    delete:
      tags: [Credentials]
      summary: 解绑 NFC 卡
      security:
        - bearerAuth: []
      parameters:
        - name: credentialId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 已解绑

  /app/qr-token:
    post:
      tags: [Credentials]
      summary: 生成 QR 开门 Token
      description: 生成一次性 QR 码 Token，有效期 5 分钟
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                door_id:
                  type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                  expires_at:
                    type: string
                    format: date-time

  # ─────────────────────────────────────────────
  # VISITORS
  # ─────────────────────────────────────────────
  /app/visitor-passes:
    get:
      tags: [Visitors]
      summary: 获取访客通行证列表
      security:
        - bearerAuth: []
      parameters:
        - name: offset
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedVisitorPasses'
    post:
      tags: [Visitors]
      summary: 创建访客通行证
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateVisitorPassRequest'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisitorPass'

  /app/places/{placeId}/visitor-groups:
    get:
      tags: [Visitors]
      summary: 获取访客组列表
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/placeId'
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/VisitorGroup'
    post:
      tags: [Visitors]
      summary: 创建访客组
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/placeId'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                auto_remove_expired:
                  type: boolean
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisitorGroup'

  /app/places/{placeId}/visitor-groups/{groupId}/members:
    get:
      tags: [Visitors]
      summary: 获取访客组成员
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/placeId'
        - name: groupId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/VisitorGroupMember'

  /app/places/{placeId}/visitor-groups/{groupId}/cleanup-expired:
    post:
      tags: [Visitors]
      summary: 清理过期访客
