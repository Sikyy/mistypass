      security:
        - bearerAuth: []
      parameters:
        - name: gatewayId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string

  /app/cameras/{cameraId}:
    patch:
      tags: [Admin-Cameras]
      summary: 重命名摄像头
      security:
        - bearerAuth: []
      parameters:
        - name: cameraId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Camera'

  # ─────────────────────────────────────────────
  # ADMIN: SETTINGS
  # ─────────────────────────────────────────────
  /app/orgs/{orgId}/settings:
    get:
      tags: [Admin-Settings]
      summary: 获取组织设置
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/orgId'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgSettings'
    put:
      tags: [Admin-Settings]
      summary: 更新组织设置
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/orgId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrgSettings'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgSettings'

  /app/places/{placeId}/settings:
    get:
      tags: [Admin-Settings]
      summary: 获取场所设置
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/placeId'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Place'
    put:
      tags: [Admin-Settings]
      summary: 更新场所设置
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/placeId'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                address:
                  type: string
                timezone:
                  type: string
                capacity:
                  type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Place'

  /app/places/{placeId}/doors/{doorId}/restrictions:
    get:
      tags: [Admin-Events]
      summary: 获取门禁限制
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/placeId'
        - $ref: '#/components/parameters/doorId'
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object

  /app/places/{placeId}/doors/{doorId}/schedules:
    get:
      tags: [Admin-Schedules]
      summary: 获取门关联的时间表
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/placeId'
        - $ref: '#/components/parameters/doorId'
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminSchedule'

  # ─────────────────────────────────────────────
  # GATEWAY (设备→云端)
  # ─────────────────────────────────────────────
  /gateway/register:
    post:
      tags: [Gateway]
      summary: 网关设备注册
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [serial_number, model, firmware_version]
              properties:
                serial_number:
                  type: string
                model:
                  type: string
                firmware_version:
                  type: string
      responses:
        '201':
          description: 注册成功，返回 gateway_token

  /gateway/activate:
    post:
      tags: [Gateway]
      summary: 网关激活
      security:
        - gatewayAuth: []
      responses:
        '200':
          description: 激活成功

  /gateway/heartbeat:
    post:
      tags: [Gateway]
      summary: 网关心跳
      security:
        - gatewayAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                uptime_seconds:
                  type: integer
                firmware_version:
                  type: string
                connected_readers:
                  type: integer
      responses:
        '200':
          description: 心跳确认

  /gateway/events:
    post:
      tags: [Gateway]
      summary: 上报门禁事件
      security:
        - gatewayAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [events]
              properties:
                events:
                  type: array
                  items:
                    type: object
      responses:
        '200':
          description: 事件已接收

  /gateway/config:
    get:
      tags: [Gateway]
      summary: 拉取配置
      description: 返回网关管辖的门、用户公钥、时间表等配置
      security:
        - gatewayAuth: []
      responses:
        '200':
          description: 网关配置

  /gateway/verify:
    post:
      tags: [Gateway]
      summary: 在线验证 BLE 凭证
      security:
        - gatewayAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [user_id, nonce, signature]
              properties:
                user_id:
                  type: string
                nonce:
                  type: string
                  format: byte
                signature:
                  type: string
                  format: byte
      responses:
        '200':
          description: 验证结果
          content:
            application/json:
              schema:
                type: object
                properties:
                  verified:
                    type: boolean
                  credential_id:
                    type: string

# ═══════════════════════════════════════════════
# COMPONENTS
# ═══════════════════════════════════════════════
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    gatewayAuth:
      type: http
      scheme: bearer
      description: 网关设备 Token

  parameters:
    orgId:
      name: orgId
      in: path
      required: true
      schema:
        type: string
      description: 组织 ID (tenant_id)
    placeId:
      name: placeId
      in: path
      required: true
      schema:
        type: string
      description: 场所 ID (building_id)
    doorId:
      name: doorId
      in: path
      required: true
      schema:
        type: string
      description: 门 ID
    userId:
      name: userId
      in: path
      required: true
      schema:
        type: string
      description: 用户 ID
    groupId:
      name: groupId
      in: path
      required: true
      schema:
        type: string
      description: 门禁组 ID

  schemas:
    # ── Auth ──
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
        mfa_code:
          type: string
          description: 可选 TOTP 验证码

    LoginResponse:
      type: object
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        expires_in:
          type: integer
          description: Token 有效期（秒）
        user:
          $ref: '#/components/schemas/User'

    RefreshResponse:
      type: object
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        expires_in:
          type: integer

    OrgAuthConfig:
      type: object
      properties:
        domain:
          type: string
        name:
          type: string
        logo:
          type: string
          format: uri
        methods:
          type: array
          items:
            type: string
            enum: [password, magic_link, saml, google, microsoft]

    # ── User ──
    User:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [super_admin, tenant_admin, building_admin, operator, member]
        tenant_id:
          type: string
        building_ids:
          type: array
          items:
            type: string
        language:
          type: string
        avatar_url:
          type: string
          format: uri
        password_auth_enabled:
          type: boolean

    UserLogin:
      type: object
      properties:
        id:
          type: string
        device_name:
          type: string
        ip_address:
          type: string
        last_active_at:
          type: string
          format: date-time
        is_current:
          type: boolean

    # ── Organization ──
    Organization:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        logo:
          type: string
          format: uri
        role:
          type: string
        is_current:
          type: boolean

    Place:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        address:
          type: string
        region:
          type: string
        timezone:
          type: string
        capacity:
          type: integer

    # ── Door ──
    AccessibleDoor:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        building_id:
          type: string
        floor:
          type: string
        area:
          type: string
        gateway_id:
          type: string
        kind:
          type: string
          enum: [standard, turnstile, elevator, parking_gate]
        status:
          type: string
          enum: [online, offline, locked_down]
        is_favorite:
          type: boolean
        lock_id:
          type: string

    UnlockResponse:
      type: object
      properties:
        status:
          type: string
          enum: [success, failed, timeout]
        message:
          type: string

    # ── Credential ──
    RegisterMobileCredentialRequest:
      type: object
      required: [public_key_pem, platform, device_id, device_model, keystore_level]
      properties:
        public_key_pem:
          type: string
          description: PEM 编码的 EC P-256 公钥
        platform:
          type: string
          enum: [android, ios]
        device_id:
          type: string
        device_model:
          type: string
        keystore_level:
          type: string
          enum: [strongbox, tee, software]
          description: |
            Android: strongbox (Titan M) > tee (TEE) > software
            iOS: 始终为 strongbox (Secure Enclave)
        attestation_cert_chain:
          type: array
          items:
            type: string
          description: Android Key Attestation 证书链（可选）

    MobileCredential:
      type: object
      properties:
        id:
          type: string
        user_id:
          type: string
        device_id:
          type: string
        platform:
          type: string
        device_model:
          type: string
        keystore_level:
          type: string
        status:
          type: string
          enum: [active, revoked, expired]
        issued_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time

    NFCCard:
      type: object
      properties:
        id:
          type: string
        device_name:
          type: string
        public_key_fingerprint:
          type: string
          description: 标准化后的 NFC UID
        card_type:
          type: string
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string

    # ── Visitor ──
    CreateVisitorPassRequest:
      type: object
      required: [visitor_name, visitor_email]
      properties:
        visitor_name:
          type: string
        visitor_email:
          type: string
          format: email
        valid_from:
          type: string
          format: date-time
        valid_until:
          type: string
          format: date-time
        door_ids:
          type: array
          items:
            type: string

    VisitorPass:
      type: object
      properties:
        id:
          type: string
        visitor_name:
          type: string
        visitor_email:
          type: string
        status:
          type: string
        valid_from:
          type: string
          format: date-time
        valid_until:
          type: string
          format: date-time

    VisitorGroup:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        member_count:
          type: integer
        auto_remove_expired:
          type: boolean

    VisitorGroupMember:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
        status:
          type: string
        expires_at:
          type: string
          format: date-time

    # ── Admin Models ──
    AdminUser:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
        role:
          type: string
        avatar_url:
          type: string
        last_active_at:
          type: string
          format: date-time

    AdminGroup:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        member_count:
          type: integer
        door_count:
          type: integer

    GroupMember:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string

    GroupDoor:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        floor:
          type: string

    AdminTeam:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        member_count:
          type: integer

    TeamMember:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
        role:
          type: string

    TeamAccessRight:
      type: object
      properties:
        id:
          type: string
        role:
          type: string
        scope:
          type: string
        scope_id:
          type: string

    AdminSchedule:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        type:
          type: string
          enum: [unlock, auto_lock, visitor_access]
        days_of_week:
          type: array
          items:
            type: integer
        start_time:
          type: string
          example: "08:00"
        end_time:
          type: string
          example: "18:00"
        door_id:
          type: string

    ScheduleWriteRequest:
      type: object
      required: [name, type, days_of_week, start_time, end_time]
      properties:
        name:
          type: string
        type:
          type: string
        days_of_week:
          type: array
          items:
            type: integer
        start_time:
          type: string
        end_time:
          type: string
        door_id:
          type: string

    AdminEvent:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
        actor:
          type: string
        door_id:
          type: string
        result:
          type: string
          enum: [granted, denied, error]
        at:
          type: string
          format: date-time

    AdminIncident:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
        severity:
          type: string
          enum: [critical, high, medium, low]
        status:
          type: string
          enum: [open, investigating, resolved]
        description:
          type: string
        created_at:
          type: string
          format: date-time

    Alarm:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
        severity:
          type: string
          enum: [critical, high, medium, low]
        location:
          type: string
        status:
          type: string
          enum: [open, acknowledged, resolved, false_positive]
        created_at:
          type: string
          format: date-time

    AlarmSchedule:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        days_of_week:
          type: array
          items:
            type: integer
        start_time:
          type: string
        end_time:
          type: string
        alarm_types:
          type: array
          items:
            type: string
        enabled:
          type: boolean

    GuestVisit:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
        company:
          type: string
        host_name:
          type: string
        status:
          type: string
          enum: [expected, checked_in, checked_out]
        expected_at:
          type: string
          format: date-time
        checked_in_at:
          type: string
          format: date-time
        checked_out_at:
          type: string
          format: date-time

    CreateGuestRequest:
      type: object
      required: [name, email, expected_at]
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        company:
          type: string
        host_name:
          type: string
        expected_at:
          type: string
          format: date-time

    Booking:
      type: object
      properties:
        id:
          type: string
        space_id:
          type: string
        space_name:
          type: string
        user_id:
          type: string
        user_name:
          type: string
        status:
          type: string
          enum: [active, checked_in, completed, cancelled]
        start_time:
          type: string
          format: date-time
        end_time:
          type: string
          format: date-time

    CreateBookingRequest:
      type: object
      required: [space_id, start_time, end_time]
      properties:
        space_id:
          type: string
        title:
          type: string
        start_time:
          type: string
          format: date-time
        end_time:
          type: string
          format: date-time

    Camera:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        model:
          type: string
        status:
          type: string
          enum: [online, offline]
        building_id:
          type: string
        location:
          type: string

    AnalyticsSummary:
      type: object
      properties:
        total_unlocks:
          type: integer
        unique_users:
          type: integer
        peak_hour:
          type: integer
        top_doors:
          type: array
          items:
            type: object
            properties:
              door_id:
                type: string
              door_name:
                type: string
              count:
                type: integer
        daily_trend:
          type: array
          items:
            type: object
            properties:
              date:
                type: string
                format: date
              count:
                type: integer
        method_breakdown:
          type: object
          properties:
            ble:
              type: integer
            nfc:
              type: integer
            pin:
              type: integer
            qr:
              type: integer
            remote:
              type: integer
        hourly_heatmap:
          type: array
          items:
            type: array
