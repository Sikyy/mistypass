services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    image: mistypass-api:dev
    container_name: mistypass-api
    depends_on:
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_started
      redis:
        condition: service_healthy
      nats:
        condition: service_started
      gotenberg:
        condition: service_started
    environment:
      TZ: "${TZ:-Asia/Jakarta}"
      DEFAULT_TIMEZONE: "${DEFAULT_TIMEZONE:-Asia/Jakarta}"
      APP_ENV: "${APP_ENV:-development}"
      ENABLE_DEMO_USERS: "${ENABLE_DEMO_USERS:-false}"
      JWT_SECRET: "${JWT_SECRET:-}"
      HRIS_VAULT_MASTER_KEY: "${HRIS_VAULT_MASTER_KEY:-}"
      HRIS_VAULT_MASTER_KEY_PREVIOUS: "${HRIS_VAULT_MASTER_KEY_PREVIOUS:-}"
      PORT: "8080"
      CORS_ORIGIN: "${CORS_ORIGIN:-http://localhost:5173}"
      EXTERNAL_AUTH_ENABLED: "${EXTERNAL_AUTH_ENABLED:-false}"
      EXTERNAL_AUTH_PROVIDER: "${EXTERNAL_AUTH_PROVIDER:-generic_oidc}"
      EXTERNAL_AUTH_USERINFO_URL: "${EXTERNAL_AUTH_USERINFO_URL:-}"
      EXTERNAL_AUTH_TIMEOUT: "${EXTERNAL_AUTH_TIMEOUT:-8s}"
      EXTERNAL_AUTH_DEFAULT_ROLE: "${EXTERNAL_AUTH_DEFAULT_ROLE:-resident}"
      OAUTH2_ENABLED: "${OAUTH2_ENABLED:-false}"
      DATABASE_URL: "postgres://postgres:${POSTGRES_PASSWORD:-mistypass-dev}@pgbouncer:5432/mistypass?sslmode=disable"
      DATABASE_AUTO_MIGRATE: "true"
      GATEWAY_BOOTSTRAP_TOKEN: "${GATEWAY_BOOTSTRAP_TOKEN:-mistypass-dev}"
      GATEWAY_REQUIRE_REQUEST_NONCE: "${GATEWAY_REQUIRE_REQUEST_NONCE:-false}"
      GATEWAY_WS_MAX_SESSION_TTL: "${GATEWAY_WS_MAX_SESSION_TTL:-6h}"
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: "${REDIS_PASSWORD:-mistypass-dev}"
      REDIS_DB: "0"
      REDIS_KEY_PREFIX: mistypass
      NATS_ENABLED: "${NATS_ENABLED:-true}"
      NATS_SERVER_URL: "nats://nats:4222"
      NATS_SUBJECT_PREFIX: mistypass
      GATEWAY_MTLS_ADDR: "${GATEWAY_MTLS_ADDR:-}"
      GATEWAY_MTLS_SERVER_CERT_PEM: "${GATEWAY_MTLS_SERVER_CERT_PEM:-}"
      GATEWAY_MTLS_SERVER_KEY_PEM: "${GATEWAY_MTLS_SERVER_KEY_PEM:-}"
      GATEWAY_CA_CERT_PEM: "${GATEWAY_CA_CERT_PEM:-}"
      GATEWAY_CA_KEY_PEM: "${GATEWAY_CA_KEY_PEM:-}"
      UPLOAD_STORAGE_DIR: "${UPLOAD_STORAGE_DIR:-}"
      UPLOAD_SIGNING_KEY: "${UPLOAD_SIGNING_KEY:-}"
      UPLOAD_MAX_SIZE_BYTES: "${UPLOAD_MAX_SIZE_BYTES:-10485760}"
      UPLOAD_URL_TTL: "${UPLOAD_URL_TTL:-15m}"
      GOTENBERG_URL: "http://gotenberg:3000"
      REPORT_EMAIL_ENABLED: "${REPORT_EMAIL_ENABLED:-false}"
      REPORT_EMAIL_FROM: "${REPORT_EMAIL_FROM:-}"
      MAIL_PROVIDER: "${MAIL_PROVIDER:-}"
      CLOUDFLARE_ACCOUNT_ID: "${CLOUDFLARE_ACCOUNT_ID:-}"
      CLOUDFLARE_EMAIL_ENDPOINT: "${CLOUDFLARE_EMAIL_ENDPOINT:-}"
      CLOUDFLARE_EMAIL_API_TOKEN: "${CLOUDFLARE_EMAIL_API_TOKEN:-}"
      CLOUDFLARE_EMAIL_TIMEOUT: "${CLOUDFLARE_EMAIL_TIMEOUT:-15s}"
      USER_INVITATION_EMAIL_PROVIDER: "${USER_INVITATION_EMAIL_PROVIDER:-queue}"
      USER_INVITATION_EMAIL_FROM: "${USER_INVITATION_EMAIL_FROM:-no-reply@mistypass.local}"
      USER_INVITATION_RESEND_ENDPOINT: "${USER_INVITATION_RESEND_ENDPOINT:-}"
      USER_INVITATION_RESEND_API_KEY: "${USER_INVITATION_RESEND_API_KEY:-}"
      USER_INVITATION_RESEND_TIMEOUT: "${USER_INVITATION_RESEND_TIMEOUT:-5s}"
      USER_INVITATION_PROVIDER_WEBHOOK_SECRET: "${USER_INVITATION_PROVIDER_WEBHOOK_SECRET:-}"
      EMAIL_INBOUND_WEBHOOK_SECRET: "${EMAIL_INBOUND_WEBHOOK_SECRET:-}"
      WALLET_ALERT_DISPATCH_MOCK_TRANSIENT_FAIL_COUNT: "${WALLET_ALERT_DISPATCH_MOCK_TRANSIENT_FAIL_COUNT:-0}"
      WALLET_ALERT_EMAIL_PROVIDER: "${WALLET_ALERT_EMAIL_PROVIDER:-mock}"
      WALLET_ALERT_EMAIL_FROM: "${WALLET_ALERT_EMAIL_FROM:-no-reply@mistypass.local}"
      WALLET_ALERT_EMAIL_RECEIVER_MAP: "${WALLET_ALERT_EMAIL_RECEIVER_MAP:-}"
      WALLET_ALERT_RESEND_ENDPOINT: "${WALLET_ALERT_RESEND_ENDPOINT:-}"
      WALLET_ALERT_RESEND_API_KEY: "${WALLET_ALERT_RESEND_API_KEY:-}"
      WALLET_ALERT_RESEND_TIMEOUT: "${WALLET_ALERT_RESEND_TIMEOUT:-5s}"
      WALLET_ALERT_WHATSAPP_PROVIDER: "${WALLET_ALERT_WHATSAPP_PROVIDER:-mock}"
      WALLET_ALERT_WHATSAPP_RECEIVER_MAP: "${WALLET_ALERT_WHATSAPP_RECEIVER_MAP:-}"
      WALLET_ALERT_WHATSAPP_ENDPOINT: "${WALLET_ALERT_WHATSAPP_ENDPOINT:-}"
      WALLET_ALERT_WHATSAPP_API_KEY: "${WALLET_ALERT_WHATSAPP_API_KEY:-}"
      WALLET_ALERT_WHATSAPP_PHONE_NUMBER_ID: "${WALLET_ALERT_WHATSAPP_PHONE_NUMBER_ID:-}"
      WALLET_ALERT_WHATSAPP_TIMEOUT: "${WALLET_ALERT_WHATSAPP_TIMEOUT:-5s}"
      WALLET_ALERT_WHATSAPP_TEMPLATE_NAME: "${WALLET_ALERT_WHATSAPP_TEMPLATE_NAME:-}"
      WALLET_ALERT_WHATSAPP_TEMPLATE_LANG: "${WALLET_ALERT_WHATSAPP_TEMPLATE_LANG:-}"
      LARK_ALERT_WEBHOOK_URL: "${LARK_ALERT_WEBHOOK_URL:-}"
      LARK_VERIFICATION_TOKEN: "${LARK_VERIFICATION_TOKEN:-}"
      CAMERA_ENABLED: "${CAMERA_ENABLED:-false}"
      CAMERA_VAULT_MASTER_KEY: "${CAMERA_VAULT_MASTER_KEY:-}"
      CAMERA_SNAPSHOT_TIMEOUT: "${CAMERA_SNAPSHOT_TIMEOUT:-10}"
      CAMERA_SNAPSHOT_RETENTION_DAYS: "${CAMERA_SNAPSHOT_RETENTION_DAYS:-30}"
      CAMERA_MAX_SNAPSHOTS_PER_EVENT: "${CAMERA_MAX_SNAPSHOTS_PER_EVENT:-3}"
      HIK_ISC_ENABLED: "${HIK_ISC_ENABLED:-false}"
      HIK_ISC_HOST: "${HIK_ISC_HOST:-https://open.hikconnect.com}"
      HIK_ISC_APP_KEY: "${HIK_ISC_APP_KEY:-}"
      HIK_ISC_APP_SECRET: "${HIK_ISC_APP_SECRET:-}"
      HIK_ISC_TOKEN_CACHE_TTL: "${HIK_ISC_TOKEN_CACHE_TTL:-115m}"
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:9443:9443"
    restart: unless-stopped

  postgres:
    image: postgres:16
    container_name: mistypass-postgres
    environment:
      POSTGRES_DB: mistypass
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-mistypass-dev}"
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - mistypass_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mistypass"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: mistypass-pgbouncer
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_USER: postgres
      DB_PASSWORD: "${POSTGRES_PASSWORD:-mistypass-dev}"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: mistypass
      POOL_MODE: transaction
      MAX_CLIENT_CONN: "300"
      DEFAULT_POOL_SIZE: "30"
      AUTH_TYPE: scram-sha-256
    ports:
      - "127.0.0.1:6432:5432"
    restart: unless-stopped

  redis:
    image: redis:7
    container_name: mistypass-redis
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--requirepass",
        "${REDIS_PASSWORD:-mistypass-dev}",
      ]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - mistypass_redis_data:/data
    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "--no-auth-warning",
          "-a",
          "${REDIS_PASSWORD:-mistypass-dev}",
          "ping",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  emqx:
    image: emqx/emqx:5.10.1
    container_name: mistypass-emqx
    environment:
      EMQX_DASHBOARD__DEFAULT_USERNAME: "${EMQX_DASHBOARD_USERNAME:-admin}"
      EMQX_DASHBOARD__DEFAULT_PASSWORD: "${EMQX_DASHBOARD_PASSWORD:-mistypass-dev}"
    ports:
      - "127.0.0.1:1883:1883"
      - "127.0.0.1:8083:8083"
      - "127.0.0.1:8084:8084"
      - "127.0.0.1:18083:18083"
    volumes:
      - mistypass_emqx_data:/opt/emqx/data
      - mistypass_emqx_log:/opt/emqx/log
    restart: unless-stopped

  nats:
    image: nats:2.10-alpine
    container_name: mistypass-nats
    command: ["-js"]
    ports:
      - "127.0.0.1:4222:4222"
      - "127.0.0.1:8222:8222"
    restart: unless-stopped

  gotenberg:
    image: gotenberg/gotenberg:8
    restart: unless-stopped
    command:
      - "gotenberg"
      - "--api-timeout=30s"
      - "--log-level=warn"
    deploy:
      resources:
        limits:
          memory: 512M

volumes:
  mistypass_postgres_data:
  mistypass_redis_data:
  mistypass_emqx_data:
  mistypass_emqx_log:
